name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build tokens & components
        run: npm run tokens

      - name: Token lint (contract enforcement)
        run: npm run lint:tokens

      - name: Schema lint (component contracts)
        run: npm run lint:schema

      - name: ESLint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc -b

      - name: Production build
        run: npm run build

      - name: Verify AI endpoints exist in dist
        run: |
          for f in skill.md design.md tokens.json components.md components.json llms.txt og-cover.svg sitemap.xml robots.txt; do
            if [ ! -f "dist/$f" ]; then
              echo "✗ Missing dist/$f"
              exit 1
            fi
            echo "✓ dist/$f"
          done

  zero-shot-baseline:
    runs-on: ubuntu-latest
    needs: build-and-lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run tokens
      - run: npm run eval:zero-shot

      - name: Upload zero-shot baseline snapshot
        uses: actions/upload-artifact@v4
        with:
          name: zero-shot-results
          path: zero-shot-tests/results/
          retention-days: 90
